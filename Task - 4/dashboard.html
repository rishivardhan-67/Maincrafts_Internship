<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainCrafts Technology | Task Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-cubes"></i> MainCrafts</a>
            <button class="mobile-menu-toggle"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                    <li><a href="submissions.html" class="nav-link">Submissions</a></li>
                    <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <div class="hero-container">
                <h1>Task Manager Dashboard</h1>
                <p>Track your development workflow milestones with interactive frontend CRUD tracking systems.</p>
            </div>
        </section>

        <section class="content-section">
            <div class="dashboard-grid">
                <div class="dashboard-controls-panel">
                    <div class="card">
                        <h3 style="margin-bottom: 1rem; font-size: 1.1rem; color: var(--dark-bg);">
                            <i class="fa-solid fa-square-plus" style="color: var(--primary-color); margin-right: 8px;"></i>Create New Task
                        </h3>
                        <form id="taskForm">
                            <div class="form-group">
                                <input type="text" id="taskInput" class="form-control" placeholder="e.g., Finish Full Stack Assignment" required>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                                <i class="fa-solid fa-plus"></i> Add Task
                            </button>
                        </form>
                    </div>
                </div>

                <div class="dashboard-display-panel">
                    <div class="section-header" style="text-align: left; margin-bottom: 1.5rem;">
                        <h2 style="font-size: 1.5rem;">Active Workspace</h2>
                        <div class="header-line" style="margin: 0.5rem 0 0 0; width: 50px;"></div>
                    </div>
                    
                    <div class="workspace-filter-bar">
                        <div class="search-input-wrapper">
                            <input type="text" id="taskSearch" class="form-control" placeholder="Search tasks...">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        </div>
                        <div class="filter-dropdown-wrapper">
                            <select id="taskFilter" class="form-control" style="cursor: pointer;">
                                <option value="all">Show All Tasks</option>
                                <option value="pending">Pending Only</option>
                                <option value="completed">Completed Only</option>
                            </select>
                        </div>
                    </div>
                    
                    <ul id="taskList" class="task-list-wrapper">
                        </ul>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 MainCrafts Technology. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
